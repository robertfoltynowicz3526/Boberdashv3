<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Serwisowy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>System Serwisowy</h1>
    <nav>
      <button class="tab-button active" data-tab="zlecenia">Zlecenia</button>
      <button class="tab-button" data-tab="klienci">Klienci</button>
      <button class="tab-button" data-tab="maszyny">Maszyny</button>
      <button class="tab-button" data-tab="magazyn">Magazyn</button>
      <button class="tab-button" data-tab="kalendarz">Kalendarz</button>
    </nav>
  </header>

  <main>
    <section id="zlecenia" class="tab-content active">
      <h2>Zlecenia</h2>
      <div class="search-section">
        <input type="search" id="zlecenie-search" placeholder="Szukaj zleceń...">
      </div>
      <div id="aktywne-zlecenia"></div>
      <hr>
      <div id="ukonczone-zlecenia"></div>
    </section>

    <!-- Nowy MODAL: Notatka przy zakończeniu zlecenia -->
    <div id="noteModal" class="modal">
      <div class="modal-content">
        <span class="close-button" id="close-note-modal">&times;</span>
        <h3>Dodaj notatkę do zlecenia</h3>
        <form id="noteForm">
          <input type="hidden" id="note-zlecenie-id">
          <div class="form-group">
            <label for="note-text">Opis wykonanych prac:</label>
            <textarea id="note-text" rows="5" placeholder="Wpisz szczegóły wykonanych czynności..." required></textarea>
          </div>
          <div class="form-group">
            <label for="note-godziny">Fakturowane godziny:</label>
            <input type="number" id="note-godziny" step="0.1" min="0" required>
          </div>
          <div class="form-group">
            <label for="note-typ">Typ zlecenia:</label>
            <select id="note-typ">
              <option value="S">Standard</option>
              <option value="G">Gwarancja</option>
              <option value="W">Wewnętrzne</option>
            </select>
          </div>
          <button type="submit" class="btn-add">Zapisz i zakończ</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
