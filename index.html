<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Serwisowy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>

    <header class="header">
        <h1>Dashboard Serwisowy</h1>
        <div class="theme-switcher">
            <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
            <label for="theme-toggle" class="theme-toggle-label"></label>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <section class="card zlecenia">
                <h2>Nowe zlecenia</h2>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Wyszukaj po ID, kliencie, maszynie...">
                </div>
                <ul id="nowe-zlecenia-lista" class="zlecenia-lista">
                    </ul>
            </section>

            <section class="card zlecenia">
                <h2 id="zakonczone-header" class="collapsible-header">
                    Zakończone zlecenia
                    <span class="toggle-arrow">▼</span>
                </h2>
                <div id="zakonczone-content" class="collapsible-content">
                    <ul id="zakonczone-zlecenia-lista" class="zlecenia-lista">
                        </ul>
                </div>
            </section>
        </div>

        <aside class="sidebar">
            <section class="card kalendarz">
                <h2>Kalendarz</h2>
                <div class="calendar-header">
                    <button id="prev-month" class="calendar-nav">&lt;</button>
                    <h3 id="month-year"></h3>
                    <button id="next-month" class="calendar-nav">&gt;</button>
                </div>
                <div id="calendar-grid" class="calendar-grid">
                    </div>
            </section>

            <section class="card">
                <h2>Klienci</h2>
                <ul id="klienci-lista">
                    </ul>
            </section>

            <section class="card">
                <h2>Maszyny</h2>
                <ul id="maszyny-lista">
                    </ul>
            </section>
        </aside>
    </div>

    <div id="modal-backdrop" class="modal-backdrop hidden"></div>

    <div id="app-modal" class="modal hidden">
        <button id="modal-close-btn" class="modal-close-btn">&times;</button>
        <h2 id="modal-title"></h2>
        <div id="modal-content">
            </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
